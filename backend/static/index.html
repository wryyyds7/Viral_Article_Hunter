<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爆文猎人 - Viral Article Hunter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #f97316, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        p {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 2rem;
        }
        .api-links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .api-links a {
            color: #f97316;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border: 1px solid #f9731640;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .api-links a:hover {
            background: #f9731620;
            border-color: #f97316;
        }
        .status {
            margin-top: 2rem;
            padding: 1rem;
            border-radius: 8px;
            background: #1e293b;
            border: 1px solid #334155;
        }
        .status code {
            color: #22c55e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>爆文猎人</h1>
        <p>Viral Article Hunter - AI驱动的爆款内容分析平台</p>
        <div class="api-links">
            <a href="/docs">API 文档 (Swagger)</a>
            <a href="/redoc">API 文档 (ReDoc)</a>
            <a href="/health">健康检查</a>
        </div>
        <div class="status">
            <p>后端服务: <code id="status">检测中...</code></p>
        </div>
    </div>
    <script>
        fetch('/health')
            .then(r => r.json())
            .then(d => {
                document.getElementById('status').textContent = 
                    d.status === 'ok' ? '运行中 v' + d.version : '异常';
            })
            .catch(() => {
                document.getElementById('status').textContent = '连接失败';
            });
    </script>
</body>
</html>
